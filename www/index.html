<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DendroGeo</title>
<meta name="description" content="Registro georreferenciado y monitoreo histórico de árboles, con funcionamiento sin conexión.">
<meta name="theme-color" content="#ffffff">
<script>try{var t=localStorage.getItem("dg-tema");if(t==="oscuro"||t==="claro")document.documentElement.setAttribute("data-theme",t==="oscuro"?"dark":"light")}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DendroGeo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14.5" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <circle cx="16" cy="16" r="10" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity=".7"/>
      <circle cx="16" cy="16" r="5.5" fill="none" stroke="var(--accent)" stroke-width="1.2" opacity=".5"/>
      <circle cx="16" cy="16" r="1.8" fill="var(--tape)"/>
    </svg>
    <div class="brand"><b>DendroGeo</b><small id="brand-sub">Inventario y monitoreo de árboles</small></div>
    <div class="spacer"></div>
    <button class="tema-btn" id="tema-btn" type="button" aria-label="Cambiar a fondo oscuro" title="Fondo claro / oscuro">
      <svg class="i-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <svg class="i-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
    </button>
    <button class="sync-pill" id="sync-pill" data-s="off" type="button" aria-live="polite"><span class="dot"></span><span id="sync-text">Local</span></button>
  </header>

  <main id="main"></main>

  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button type="button" data-v="registrar" aria-label="Registrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><path d="M12 7v6M9 10h6"/></svg>Registrar</button>
    <button type="button" data-v="mapa" aria-label="Mapa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
    <button type="button" data-v="arboles" aria-label="Árboles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3.5 0 6 2.6 6 5.6 0 1-.3 1.9-.8 2.7A4.5 4.5 0 0 1 14 19h-4a4.5 4.5 0 0 1-3.2-7.7A5 5 0 0 1 6 8.6C6 5.6 8.5 3 12 3z"/><path d="M12 12v9"/></svg>Árboles</button>
    <button type="button" data-v="panel" aria-label="Panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Panel</button>
    <button type="button" data-v="ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>
</div>

<script src="vendor/capacitor.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
